name: Docs

on:
  push:
    branches: [ "**" ]
    paths:
      - "**/*.md"
  pull_request:
    branches: [ "deuda-tecnica" ]
    paths:
      - "**/*.md"
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --verbose
            --exclude 'localhost'
            --exclude '127\.0\.0\.1'
            --exclude 'linkedin\.com'
            './**/*.md'
          fail: true
