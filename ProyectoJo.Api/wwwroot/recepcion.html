<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recepción — Proyecto Jo'</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #f4f1ec;
            margin: 0;
            padding: 24px;
        }

        h1 {
            color: #2563eb;
        }

        h2 {
            color: #3a2e26;
            font-size: 1.1rem;
            margin-top: 32px;
        }

        a.back {
            color: #6b6258;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .layout {
            display: flex;
            gap: 24px;
            margin-top: 16px;
        }

        .col-menu {
            flex: 1.4;
        }

        .col-carrito {
            flex: 1;
        }

        .menu-item {
            background: white;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

            .menu-item.agotado {
                opacity: 0.5;
            }

        .menu-item-info h3 {
            margin: 0 0 4px 0;
            font-size: 1rem;
        }

        .menu-item-info .desc {
            font-size: 0.8rem;
            color: #6b6258;
            margin: 0;
        }

        .menu-item-info .precio {
            font-weight: 600;
            color: #2563eb;
            margin-top: 4px;
        }

        .menu-item button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 14px;
            cursor: pointer;
            white-space: nowrap;
        }

            .menu-item button:disabled {
                background: #ccc;
                cursor: not-allowed;
            }

        .categoria-titulo {
            margin-top: 20px;
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #9a8f82;
            letter-spacing: 0.05em;
        }

        .carrito-box {
            background: white;
            border-radius: 10px;
            padding: 16px;
            position: sticky;
            top: 24px;
        }

        .carrito-line {
            border-bottom: 1px solid #eee;
            padding: 10px 0;
        }

            .carrito-line .nombre {
                font-weight: 600;
                display: flex;
                justify-content: space-between;
            }

            .carrito-line .ingredientes-quitar {
                font-size: 0.8rem;
                color: #6b6258;
                margin-top: 4px;
            }

            .carrito-line label {
                display: block;
                font-size: 0.8rem;
            }

        .quitar-btn {
            background: none;
            border: none;
            color: #dc2626;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .tipo-entrega {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

            .tipo-entrega button {
                flex: 1;
                padding: 10px;
                border-radius: 8px;
                border: 2px solid #2563eb;
                background: white;
                color: #2563eb;
                cursor: pointer;
            }

                .tipo-entrega button.activo {
                    background: #2563eb;
                    color: white;
                }

        input.mesa-input {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .total {
            font-weight: 700;
            font-size: 1.1rem;
            text-align: right;
            margin: 12px 0;
        }

        .crear-btn {
            width: 100%;
            padding: 12px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

            .crear-btn:disabled {
                background: #ccc;
                cursor: not-allowed;
            }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 0.9rem;
        }

        th {
            background: #2563eb;
            color: white;
        }

        .estado {
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
            color: white;
        }

        .Pendiente {
            background: #f59e0b;
        }

        .Preparado {
            background: #3b82f6;
        }

        .Pagado {
            background: #16a34a;
        }

        .Cancelado {
            background: #9ca3af;
        }

        .pagar-btn {
            padding: 5px 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #2563eb;
            color: white;
            font-size: 0.8rem;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-top: 24px;
        }

            .tabs button {
                padding: 8px 16px;
                border: none;
                border-radius: 8px 8px 0 0;
                background: #e5e0d8;
                color: #6b6258;
                cursor: pointer;
                font-weight: 600;
            }

                .tabs button.activo {
                    background: white;
                    color: #2563eb;
                }
    </style>
</head>
<body>
    <a class="back" href="index.html">← Volver</a>
    <h1>🧾 Recepción</h1>

    <div class="layout">
        <div class="col-menu">
            <h2>Menú del negocio</h2>
            <div id="menu-contenedor">Cargando menú...</div>
        </div>

        <div class="col-carrito">
            <h2>Pedido actual</h2>
            <div class="carrito-box">
                <div class="tipo-entrega">
                    <button id="btn-mesa" class="activo" onclick="setTipoEntrega('mesa')">Para mesa</button>
                    <button id="btn-llevar" onclick="setTipoEntrega('llevar')">Para llevar</button>
                </div>
                <input id="mesa-input" class="mesa-input" placeholder="Número o nombre de mesa">

                <div id="carrito-lineas"><p style="color:#9a8f82;font-size:0.85rem;">Aún no has agregado productos.</p></div>

                <div class="total" id="total-carrito">Total: $0.00</div>
                <button class="crear-btn" id="crear-btn" onclick="crearPedido()" disabled>Crear pedido</button>
            </div>
        </div>
    </div>

    <div class="tabs">
        <button id="tab-activos" class="activo" onclick="cambiarTab('activos')">Pedidos activos</button>
        <button id="tab-pagados" onclick="cambiarTab('pagados')">Pagados</button>
    </div>

    <table id="tabla-activos">
        <thead><tr><th>ID</th><th>Mesa / Entrega</th><th>Items</th><th>Total</th><th>Estado</th><th>Acción</th></tr></thead>
        <tbody id="tabla-pedidos-activos"></tbody>
    </table>

    <table id="tabla-pagados" style="display:none;">
        <thead><tr><th>ID</th><th>Mesa / Entrega</th><th>Items</th><th>Total</th><th>Pagado</th></tr></thead>
        <tbody id="tabla-pedidos-pagados"></tbody>
    </table>

    <script>
        let menu = [];
        let carrito = [];
        let tipoEntrega = 'mesa';
        let tabActiva = 'activos';

        function cambiarTab(tab) {
            tabActiva = tab;
            document.getElementById('tab-activos').classList.toggle('activo', tab === 'activos');
            document.getElementById('tab-pagados').classList.toggle('activo', tab === 'pagados');
            document.getElementById('tabla-activos').style.display = tab === 'activos' ? 'table' : 'none';
            document.getElementById('tabla-pagados').style.display = tab === 'pagados' ? 'table' : 'none';
        }

        function setTipoEntrega(tipo) {
            tipoEntrega = tipo;
            document.getElementById('btn-mesa').classList.toggle('activo', tipo === 'mesa');
            document.getElementById('btn-llevar').classList.toggle('activo', tipo === 'llevar');
            document.getElementById('mesa-input').style.display = tipo === 'mesa' ? 'block' : 'none';
        }

        function extraerIngredientes(item) {
            const fuente = item.ingredientes || item.descripcion || '';
            return fuente.split(',').map(s => s.trim()).filter(s => s.length > 0);
        }

        async function cargarMenu() {
            const res = await fetch('/api/Productos/menu');
            menu = await res.json();
            const contenedor = document.getElementById('menu-contenedor');
            contenedor.innerHTML = '';

            const categorias = [...new Set(menu.map(i => i.categoria || 'Otros'))];

            categorias.forEach(cat => {
                const titulo = document.createElement('div');
                titulo.className = 'categoria-titulo';
                titulo.textContent = cat;
                contenedor.appendChild(titulo);

                menu.filter(i => (i.categoria || 'Otros') === cat).forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'menu-item' + (item.agotado ? ' agotado' : '');
                    div.innerHTML = `
            <div class="menu-item-info">
              <h3>${item.platillo}</h3>
              <p class="desc">${item.descripcion || ''}</p>
              <p class="precio">$${Number(item.precio).toFixed(2)}</p>
            </div>
            <button ${item.agotado ? 'disabled' : ''} onclick="agregarAlCarrito(${item.id})">
              ${item.agotado ? 'Agotado' : 'Agregar'}
            </button>
          `;
                    contenedor.appendChild(div);
                });
            });
        }

        function agregarAlCarrito(itemId) {
            const item = menu.find(i => i.id === itemId);
            if (!item) return;

            const existente = carrito.find(c => c.itemId === itemId && c.ingredientesQuitados.length === 0);
            if (existente) {
                existente.cantidad++;
            } else {
                carrito.push({
                    itemId: item.id,
                    nombre: item.platillo,
                    precioUnitario: item.precio,
                    cantidad: 1,
                    ingredientesDisponibles: extraerIngredientes(item),
                    ingredientesQuitados: []
                });
            }
            renderCarrito();
        }

        function cambiarCantidad(index, delta) {
            carrito[index].cantidad += delta;
            if (carrito[index].cantidad <= 0) carrito.splice(index, 1);
            renderCarrito();
        }

        function toggleIngrediente(index, ingrediente) {
            const linea = carrito[index];
            const pos = linea.ingredientesQuitados.indexOf(ingrediente);
            if (pos >= 0) linea.ingredientesQuitados.splice(pos, 1);
            else linea.ingredientesQuitados.push(ingrediente);
            renderCarrito();
        }

        function quitarLinea(index) {
            carrito.splice(index, 1);
            renderCarrito();
        }

        function renderCarrito() {
            const cont = document.getElementById('carrito-lineas');
            const crearBtn = document.getElementById('crear-btn');

            if (carrito.length === 0) {
                cont.innerHTML = '<p style="color:#9a8f82;font-size:0.85rem;">Aún no has agregado productos.</p>';
                crearBtn.disabled = true;
            } else {
                cont.innerHTML = '';
                carrito.forEach((linea, index) => {
                    const div = document.createElement('div');
                    div.className = 'carrito-line';
                    const checks = linea.ingredientesDisponibles.map(ing => {
                        const quitado = linea.ingredientesQuitados.includes(ing);
                        return `<label><input type="checkbox" ${quitado ? 'checked' : ''} onchange="toggleIngrediente(${index}, '${ing.replace(/'/g, "\\'")}')"> Sin ${ing}</label>`;
                    }).join('');

                    div.innerHTML = `
            <div class="nombre">
              <span>${linea.cantidad}x ${linea.nombre}</span>
              <span>$${(linea.precioUnitario * linea.cantidad).toFixed(2)}</span>
            </div>
            <div>
              <button onclick="cambiarCantidad(${index}, -1)">−</button>
              <button onclick="cambiarCantidad(${index}, 1)">+</button>
              <button class="quitar-btn" onclick="quitarLinea(${index})">Eliminar</button>
            </div>
            ${checks ? `<div class="ingredientes-quitar">${checks}</div>` : ''}
          `;
                    cont.appendChild(div);
                });
                crearBtn.disabled = false;
            }

            const total = carrito.reduce((sum, l) => sum + l.precioUnitario * l.cantidad, 0);
            document.getElementById('total-carrito').textContent = `Total: $${total.toFixed(2)}`;
        }

        async function crearPedido() {
            const mesaInput = document.getElementById('mesa-input').value.trim();

            if (tipoEntrega === 'mesa' && !mesaInput) {
                alert('Escribe el número o nombre de la mesa.');
                return;
            }

            const mesaTexto = tipoEntrega === 'mesa' ? `Mesa ${mesaInput}` : 'Para llevar';

            const items = carrito.map(l => {
                const sufijoQuitados = l.ingredientesQuitados.length > 0
                    ? ` (sin ${l.ingredientesQuitados.join(', ')})`
                    : '';
                return {
                    itemId: l.itemId,
                    nombre: l.nombre + sufijoQuitados,
                    cantidad: l.cantidad,
                    precioUnitario: l.precioUnitario
                };
            });

            const nuevoPedido = { mesa: mesaTexto, items: items };

            await fetch('/api/Pedidos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(nuevoPedido)
            });

            carrito = [];
            document.getElementById('mesa-input').value = '';
            renderCarrito();
            cargarPedidos();
        }

        async function cargarPedidos() {
            const res = await fetch('/api/Pedidos/recepcion');
            const pedidos = await res.json();

            const activos = pedidos.filter(p => p.estado !== 'Pagado');
            const pagados = pedidos.filter(p => p.estado === 'Pagado');

            const tbodyActivos = document.getElementById('tabla-pedidos-activos');
            tbodyActivos.innerHTML = '';
            activos.forEach(p => {
                const itemsTexto = p.items.map(i => `${i.cantidad}x ${i.nombre}`).join(', ');
                const fila = document.createElement('tr');
                fila.innerHTML = `
          <td>${p.id}</td>
          <td>${p.mesa}</td>
          <td>${itemsTexto}</td>
          <td>$${p.total.toFixed(2)}</td>
          <td><span class="estado ${p.estado}">${p.estado}</span></td>
          <td><button class="pagar-btn" onclick="marcarPagado(${p.id})">Marcar pagado</button></td>
        `;
                tbodyActivos.appendChild(fila);
            });

            const tbodyPagados = document.getElementById('tabla-pedidos-pagados');
            tbodyPagados.innerHTML = '';
            pagados.forEach(p => {
                const itemsTexto = p.items.map(i => `${i.cantidad}x ${i.nombre}`).join(', ');
                const fila = document.createElement('tr');
                fila.innerHTML = `
          <td>${p.id}</td>
          <td>${p.mesa}</td>
          <td>${itemsTexto}</td>
          <td>$${p.total.toFixed(2)}</td>
          <td>✓</td>
        `;
                tbodyPagados.appendChild(fila);
            });
        }

        async function marcarPagado(id) {
            await fetch(`/api/Pedidos/${id}/pagar`, { method: 'PATCH' });
            cargarPedidos();
        }

        setTipoEntrega('mesa');
        cambiarTab('activos');
        cargarMenu();
        cargarPedidos();
        setInterval(cargarPedidos, 3000);
    </script>
</body>
</html>
